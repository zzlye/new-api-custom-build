name: Build custom NewAPI image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compatibility:
    name: 官方更新兼容性验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: compatibility-test-only
          MYSQL_DATABASE: newapi_compat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcompatibility-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: compatibility-test-only
          POSTGRES_DB: newapi_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root:compatibility-test-only@tcp(127.0.0.1:3306)/newapi_compat?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres:compatibility-test-only@127.0.0.1:5432/newapi_compat?sslmode=disable'
      AUDIT_MYSQL_DSN: 'root:compatibility-test-only@tcp(127.0.0.1:3306)/newapi_compat?charset=utf8mb4&parseTime=True&loc=Local'
      AUDIT_POSTGRES_DSN: 'postgres://postgres:compatibility-test-only@127.0.0.1:5432/newapi_compat?sslmode=disable'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: 验证数据库迁移、定制功能与官方功能
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test -v -p 2 -timeout 20m ./...
      - name: 验证账号注销与会话撤销的数据库兼容性
        run: |
          # SQLite 压测并发凭证消费；另外两种数据库验证相同的注销安全约束。
          go test -v ./controller -run '^TestSecurityAccountDeletionConcurrentRequestsHaveOneWinner$' -count=100
          for dialect in mysql postgres; do
            TEST_SECURITY_DIALECT="$dialect" go test -v ./controller -run '^TestSecurityAccountDeletion' -count=1 -timeout 10m
          done
      - name: 独立验证协议模块
        working-directory: relaykit
        run: |
          go build ./...
          go test ./...

  frontend:
    name: 前端兼容性验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 验证前端
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

  build:
    # 三种数据库、前端与镜像真实启动均通过后才允许发布同版本镜像。
    needs: [compatibility, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建候选镜像但暂不发布
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证镜像真实启动与完整路由
        env:
          CANDIDATE_IMAGE: ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.short_sha }}
        run: bash .github/scripts/check-image-startup.sh "$CANDIDATE_IMAGE" "$RUNNER_TEMP/newapi-image-startup"

      - name: 保存镜像启动验证记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-startup-verification
          path: ${{ runner.temp }}/newapi-image-startup
          if-no-files-found: ignore

      - name: 发布已验证镜像
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"
